; Пульт и 3 робота — один проект: окружения remote, robot1, robot2, robot3.
[platformio]
default_envs = robot1

; Секция [env] без имени — общие настройки для всех окружений.
[env]
; Официальная платформа: Arduino-ESP32 2.0.x. Версии 3.x в официальной платформе
; PlatformIO не поддерживаются; для них — форк pioarduino (строка ниже, закомментирована).
platform = espressif32@^6
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Общая часть роботов. Секция с произвольным именем + extends — наследование настроек.
[robot_base]
build_src_filter = -<*> +<robot/>

[env:robot1]
extends = robot_base
build_flags = -DROBOT_ID=1
; upload_port = COM6
; monitor_port = COM6

[env:robot2]
extends = robot_base
build_flags = -DROBOT_ID=2

[env:robot3]
extends = robot_base
build_flags = -DROBOT_ID=3

[env:remote]
build_src_filter = -<*> +<remote/>
; upload_port = COM6
; monitor_port = COM6
